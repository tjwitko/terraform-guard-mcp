# agent-gate, run against this repository.
#
# Circular on the face of it: this repository is one of the four control servers agent-gate runs.
# It is not recursive — the gate arrives pinned at a released tag and scans whatever is on this
# branch, so a defect introduced here cannot excuse itself. The pinned release is a fixed oracle.
#
# This repository's own fixtures are broken on purpose, because that is what proves its rules fire.
# They carry a marker declaring exactly that, the gate honours it, and the exemption is printed in
# the log with the reason on every run — visible, not silent.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, whether or not anything was pushed. Advisories arrive without a commit: between 27
  # September and 13 October every repository in this estate gained a critical and a high from new
  # advisories against dependencies nobody had touched, and CI stayed green because nothing ran.
  # The next push would have been the first to find out, and would have gone red for reasons that
  # had nothing to do with what it changed.
  #
  # Monday 06:17 UTC. Off the hour, because scheduled runs at :00 are the ones GitHub most often
  # delays or drops under load. GitHub also disables scheduled workflows in a public repository after
  # 60 days without activity -- precisely the dormant repository this is for. It emails the owner
  # when it does; re-enable it from the Actions tab.
  schedule:
    - cron: "17 6 * * 1"
  # Run it now, without pushing anything.
  workflow_dispatch:

jobs:
  gate:
    name: agent-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The gate's `tests` validator runs `node --test` against THIS repository, and the action's
      # own `npm ci --prefix $GITHUB_ACTION_PATH` installs the action's dependencies, not ours.
      # Without this step the suite cannot load its imports and every test file fails, which is
      # what happened the moment a task file switched the tests check on: three of the four gates
      # went red on a workflow that had been green for days, because the check that would have
      # caught it was gated off.
      - run: npm ci --ignore-scripts

      # One definition of what the controls need, kept where the controls are, rather than four
      # copies drifting apart in four repositories.
      - uses: tjwitko/agent-gate/.github/actions/control-tooling@v1.1.11

      - uses: tjwitko/agent-gate@v1.1.11
        with:
          project: .
          # Six checks are gated on what the task asked for; without this they report "not checked",
          # which is accurate and useless. The file states only what is true of this repository --
          # a requirement invented to switch a check on is a fabricated requirement, and this gate
          # exists to catch exactly that.
          task-file: .github/gate-task.txt
